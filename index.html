<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efjord & Stetind Resort – Romfordeling</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#111214; --muted:#6b6f76; --bg:#f2f2f4; --line:rgba(17,18,20,.10); --line-s:rgba(17,18,20,.18);
  --glass:rgba(255,255,255,.62); --glass-s:rgba(255,255,255,.82); --weekend:rgba(17,18,20,.035);
  --ac:#e8782a; --ac-d:#cf6419;
  --label:176px; --cw:30px;
  --shadow:0 8px 32px rgba(20,22,28,.08),0 1px 0 rgba(255,255,255,.8) inset;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;color:var(--ink);font:15px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.005em;
  background:radial-gradient(900px 500px at 85% 380px,#fff 0,transparent 70%),radial-gradient(700px 500px at 5% 700px,#e9eaee 0,transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 56px}
.glass,.card,.cabin-card,.tl-scroll{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}

/* Hero */
.hero{position:relative;height:clamp(330px,46vw,470px);overflow:hidden}
.hero .photo{position:absolute;inset:0;background:url(hero.jpg) center 38%/cover no-repeat;opacity:.92}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 28%,rgba(242,242,244,0) 55%,var(--bg) 100%)}
.nav{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:8px 10px 8px 18px;border-radius:18px;flex-wrap:wrap}
.nav img{height:40px;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.herotext{position:absolute;z-index:3;left:20px;right:20px;bottom:46px}
.herotext .box{display:inline-block;padding:18px 26px 20px;border-radius:22px}
.herotext h1{margin:0;font-size:clamp(28px,5vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1}
.herotext p{margin:8px 0 0;color:var(--muted);font-size:15px}
.btn{border:1px solid var(--line-s);background:rgba(255,255,255,.7);border-radius:12px;padding:9px 15px;cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{background:#fff;border-color:rgba(17,18,20,.3)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(232,120,42,.35)}
.btn.primary:hover{background:var(--ac-d)}
.btn.ghost{background:rgba(255,255,255,.55)}
.btn.danger{color:#a3342b;border-color:rgba(163,52,43,.35)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 22px}
.card{border-radius:20px;padding:16px 18px}
.card .k{font-size:12px;color:var(--muted);font-weight:500}
.card .v{font-size:30px;font-weight:500;letter-spacing:-.03em;margin-top:2px}
.card .s{color:var(--muted);font-size:13px}
.bar{height:6px;background:rgba(17,18,20,.08);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px}
.datepick{display:flex;gap:8px;align-items:center;margin-top:4px}
.datepick input{border:1px solid var(--line-s);border-radius:10px;padding:5px 9px;background:rgba(255,255,255,.8)}

/* Tabs */
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:inline-flex;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:4px;gap:4px;backdrop-filter:blur(14px)}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font-weight:500;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.hint{color:var(--muted);font-size:13px}
.jump{display:flex;gap:6px;align-items:center}

/* Timeline */
.tl-scroll{border-radius:20px;overflow:auto;max-height:min(74vh,900px);position:relative}
.tl{width:max-content;min-width:100%}
.row{display:grid;grid-template-columns:var(--label) calc(var(--cw)*62)}
.lab{position:sticky;left:0;z-index:5;background:var(--glass-s);backdrop-filter:blur(14px);border-right:1px solid var(--line-s);padding:0 12px;display:flex;align-items:center;gap:6px;min-height:34px;font-size:13px}
.lab b{font-weight:600}
.lab span{color:var(--muted)}
.thead{position:sticky;top:0;z-index:8;background:var(--glass-s);backdrop-filter:blur(16px)}
.thead .lab{z-index:9}
.months{display:grid;grid-template-columns:repeat(2,1fr);font-weight:600}
.months div{padding:6px 12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line-s)}
.months div:first-child{border-left:0}
.dh{display:grid;grid-template-columns:repeat(62,var(--cw))}
.dh div{text-align:center;font-size:11px;line-height:1.15;padding:4px 0;color:var(--muted);border-bottom:1px solid var(--line)}
.dh div b{display:block;font-size:13px;color:var(--ink);font-weight:500}
.dh .we{background:var(--weekend)}
.dh .ms,.c.ms,.free .ms{border-left:1px solid var(--line-s)}
.dh .sel b{background:var(--ink);color:#fff;border-radius:6px;margin:0 3px}
.freerow .lab{font-weight:500;border-bottom:1px solid var(--line-s);min-height:30px}
.free{display:grid;grid-template-columns:repeat(62,var(--cw));border-bottom:1px solid var(--line-s)}
.free div{text-align:center;font-size:12px;font-weight:500;padding:5px 0}
.free .f2{color:#4b4f56}
.free .f1{background:rgba(232,120,42,.12);color:#a4500f}
.free .f0{background:rgba(17,18,20,.9);color:#fff}
.cabin-h{grid-column:1/-1;background:rgba(17,18,20,.045);font-weight:600;padding:8px 12px;border-top:1px solid var(--line-s);border-bottom:1px solid var(--line)}
.cabin-h .ct{position:sticky;left:12px;display:inline-flex;gap:8px;align-items:baseline}
.cabin-h small{font-weight:400;color:var(--muted)}
.bedrow{border-bottom:1px solid var(--line)}
.bedrow.roomstart .lab,.bedrow.roomstart .days{border-top:1px solid var(--line-s)}
.days{position:relative;display:grid;grid-template-columns:repeat(62,var(--cw));min-height:34px;user-select:none;-webkit-user-select:none}
.days>*{grid-row:1}
.c{cursor:crosshair;border-left:1px solid rgba(17,18,20,.045)}
.c.we{background:var(--weekend)}
.c.sel{background:rgba(232,120,42,.25)!important;box-shadow:inset 0 0 0 1px var(--ac)}
.c:hover{background:rgba(17,18,20,.07)}
.res{z-index:2;margin:4px 1px;border-radius:9px;padding:0 9px;display:flex;align-items:center;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid;transition:.12s;backdrop-filter:blur(6px)}
.res:hover{filter:brightness(.96);box-shadow:0 3px 10px rgba(0,0,0,.14)}
.res.l{border-top-left-radius:3px;border-bottom-left-radius:3px}
.res.r{border-top-right-radius:3px;border-bottom-right-radius:3px}

/* Who-lives-where */
.cabins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cabin-card{border-radius:20px;overflow:hidden}
.cabin-card>h3{margin:0;padding:14px 18px;background:rgba(17,18,20,.045);font-size:18px;font-weight:500;letter-spacing:-.02em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cabin-card>h3 small{font-weight:400;color:var(--muted);font-size:13px}
.room{padding:10px 18px 12px;border-top:1px solid var(--line)}
.room h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between}
.bedline{display:flex;gap:8px;align-items:center;padding:4px 0;flex-wrap:wrap}
.bedline .bn{width:58px;color:var(--muted);font-size:13px}
.chip{border:1px solid;border-radius:999px;padding:2px 11px;font-weight:600;font-size:13px;cursor:pointer;background:none}
.chip small{font-weight:400;opacity:.85}
.openbed{color:var(--muted);background:rgba(255,255,255,.5);border:1px dashed var(--line-s);border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer}
.openbed:hover{border-color:var(--ac);color:var(--ac-d);background:#fff}

/* Dialogs */
dialog{border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:0;width:min(640px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(10,12,18,.28);color:var(--ink);background:rgba(255,255,255,.78);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5)}
dialog::backdrop{background:rgba(235,236,240,.55);backdrop-filter:blur(6px)}
dialog[open]{display:flex;flex-direction:column}
.dh1{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dh1 h2{margin:0;font-size:21px;font-weight:500;letter-spacing:-.03em}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.db{padding:18px 22px;overflow:auto;display:grid;gap:14px}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:rgba(255,255,255,.4)}
.df .sp{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
label.f{display:grid;gap:4px;font-weight:500;font-size:13px;color:var(--muted)}
label.f input,label.f select,.txt{border:1px solid var(--line-s);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.85);font-weight:400;font-size:15px;width:100%;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:rgba(163,52,43,.1);color:#8d2a22;padding:8px 12px;border-radius:12px;font-size:14px}
.nights{color:var(--muted);font-size:13px;margin-top:-6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-s);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.8)}
.stepper button{border:0;background:transparent;width:36px;height:36px;font-size:18px;cursor:pointer}
.stepper button:hover{background:rgba(17,18,20,.07)}
.stepper output{min-width:38px;text-align:center;font-weight:600}
.setrow{display:flex;justify-content:flex-start;align-items:center;gap:14px}
.cabin-edit{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:rgba(255,255,255,.5)}
.room-edit{display:grid;grid-template-columns:minmax(70px,.8fr) auto auto;gap:10px;align-items:end}
.cabin-edit.fadein{animation:fadein .7s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tcol{display:grid;gap:3px;justify-items:start}
.room-edit .stepper{height:38px}
.room-edit .txt{padding:8px 10px}
.sum{font-size:13px;color:var(--muted)}
.paytop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.paytop .v{font-size:34px}
.payline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.payline:last-child{border-bottom:0}
.payline:hover{background:rgba(17,18,20,.03)}
.payline{align-items:center}
.payline .chk{display:flex;align-items:center;padding-right:2px}
.payline input,.chk2 input{width:18px;height:18px;accent-color:#111;cursor:pointer}
.payline .pinfo{flex:1}
.payline.paid{opacity:.55}
.chk2{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.types{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 6px}
.tt{border:1px solid var(--line-s);background:rgba(255,255,255,.7);border-radius:9px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.tt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bedrow.dbl .lab{box-shadow:inset 3px 0 0 rgba(17,18,20,.28)}
.bedline .bn{width:auto;min-width:58px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
@media (max-width:640px){
  :root{--label:118px;--cw:28px}
  .lab{font-size:12px;padding:0 6px}
  .two{grid-template-columns:1fr}
  .nav img{height:32px}
  .herotext{bottom:36px}
}
</style>
</head>
<body>
<header class="hero">
  <div class="photo" role="img" aria-label="Solnedgang over Stetinden og fjorden"></div>
  <div class="wrap" style="position:relative;height:100%">
    <nav class="nav glass">
      <img src="logo.svg" alt="Efjord &amp; Stetind Resort">
      <div class="actions">
        <button class="btn ghost" data-action="setup">Rediger hytter</button>
        <button class="btn primary" data-action="new">+ Ny reservasjon</button>
      </div>
    </nav>
    <div class="herotext"><div class="box glass"><h1>Romfordeling</h1><p>Juli og august 2027 · hvem bor hvor</p></div></div>
  </div>
</header>

<main class="wrap" style="margin-top:-6px">
  <section class="stats" id="stats"></section>
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button role="tab" data-view="timeline">Belegg per seng</button>
      <button role="tab" data-view="who">Hvem bor hvor</button>
      <button role="tab" data-view="pay">Oppgjør</button>
    </div>
    <div class="jump" id="jump">
      <span class="hint">Gå til:</span>
      <button class="btn sm" data-jump="0">Juli</button>
      <button class="btn sm" data-jump="31">August</button>
    </div>
  </div>
  <p class="hint" id="hintline" style="margin:0 0 8px">Dra over ledige netter på en seng for å reservere. Klikk på en reservasjon for å endre eller slette. Hver kolonne er én natt; utsjekk er dagen etter siste natt.</p>
  <div id="view"></div>
</main>

<dialog id="bookDlg"></dialog>
<dialog id="setupDlg"></dialog>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
(() => {
'use strict';
const YEAR = 2027, START = Date.UTC(YEAR, 6, 1), N = 62; // 1. juli – 31. august
const KEY = 'efjord-stetind-v1';
const MONTHS = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const WD = ['S','M','T','O','T','F','L'];
const iso = i => new Date(START + i * 864e5).toISOString().slice(0, 10);
const idx = s => Math.round((Date.parse(s + 'T00:00:00Z') - START) / 864e5);
const fmt = s => { const d = new Date(s + 'T00:00:00Z'); return d.getUTCDate() + '. ' + MONTHS[d.getUTCMonth()]; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = s => document.querySelector(s);

function seed() {
  return {
    cabins: [
      { id:'c1', name:'Efjord', price:600, priceDouble:900, rooms:[ {id:'r1',name:'Rom 1',beds:4}, {id:'r2',name:'Rom 2',beds:2}, {id:'r3',name:'Rom 3',beds:2} ] },
      { id:'c2', name:'Stetind', price:500, priceDouble:800, rooms:[ {id:'r4',name:'Rom 1',beds:4}, {id:'r5',name:'Rom 2',beds:4} ] },
      { id:'c3', name:'Fjordbris', price:450, priceDouble:700, rooms:[ {id:'r6',name:'Rom 1',beds:1,types:['d']}, {id:'r7',name:'Rom 2',beds:2} ] }
    ],
    bookings: [
      { id:'b1', guest:'Petter',   bed:'r1:0', start:'2027-07-31', end:'2027-08-07' },
      { id:'b2', guest:'Lone',     bed:'r1:1', start:'2027-08-06', end:'2027-08-08' },
      { id:'b3', guest:'Ragnhild', bed:'r2:0', start:'2027-08-05', end:'2027-08-08' },
      { id:'b4', guest:'Preben',   bed:'r2:1', start:'2027-08-05', end:'2027-08-08' },
      { id:'b5', guest:'Elin',     bed:'r3:0', start:'2027-08-05', end:'2027-08-08' },
      { id:'b6', guest:'Sondre',   bed:'r3:1', start:'2027-08-05', end:'2027-08-08' }
    ]
  };
}
let state = load();
let view = 'timeline';
let selDate = '2027-08-06';

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.cabins) && Array.isArray(s.bookings)) return s; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- helpers ---------- */
const isDbl = (r, n) => !!r.types && r.types[n] === 'd';
function roomSlots(r) {
  const o = [];
  for (let n = 0; n < r.beds; n++) {
    const k = r.id + ':' + n;
    if (isDbl(r, n)) o.push({ n, dbl: true, slot: 0, key: k, sib: k + 'b' }, { n, dbl: true, slot: 1, key: k + 'b', sib: k });
    else o.push({ n, dbl: false, slot: 0, key: k, sib: null });
  }
  return o;
}
const countSlots = c => c.rooms.reduce((a, r) => a + roomSlots(r).length, 0);
const bedName = b => b.dbl ? `Dobbeltseng ${b.n + 1} · plass ${b.slot + 1}` : `Seng ${b.n + 1}`;
function allBeds() {
  const out = [];
  state.cabins.forEach(c => c.rooms.forEach(r => roomSlots(r).forEach(sl => out.push({ ...sl, cabin: c, room: r }))));
  return out;
}
const bedMap = () => Object.fromEntries(allBeds().map(b => [b.key, b]));
const occupied = (bed, i, ignore) => state.bookings.some(b => b.bed === bed && b.id !== ignore && idx(b.start) <= i && i < idx(b.end));
function overlaps(bed, s, e, ignore) { return state.bookings.some(b => b.bed === bed && b.id !== ignore && idx(b.start) < e && s < idx(b.end)); }
function color(name) {
  let h = 0; for (const ch of name.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = (h % 12) * 30 + 8;
  return { bg: `hsl(${hue} 38% 91% / .85)`, bd: `hsl(${hue} 28% 62%)`, fg: `hsl(${hue} 40% 18%)` };
}
const colorStyle = n => { const c = color(n); return `background:${c.bg};border-color:${c.bd};color:${c.fg}`; };
const price = c => +c.price || 0;
const priceD = c => +c.priceDouble || 0;
const hasType = (c, d) => c.rooms.some(r => roomSlots(r).some(s => s.dbl === d));
function priceLabel(c, suf) {
  const p = [];
  if (hasType(c, false)) p.push(price(c) ? kr(price(c)) : 'pris ikke satt');
  if (hasType(c, true)) p.push(priceD(c) ? 'dobbel ' + kr(priceD(c)) : 'dobbelpris ikke satt');
  return p.join(' · ') + (p.length ? suf : '');
}
const kr = n => n.toLocaleString('nb-NO') + ' kr';
function stayCost(b, bm) {
  const x = bm[b.bed]; if (!x) return 0;
  const s = idx(b.start), e = idx(b.end);
  if (!x.dbl) return (e - s) * price(x.cabin);
  let sum = 0; const p = priceD(x.cabin);
  for (let i = s; i < e; i++) sum += occupied(x.sib, i) ? p / 2 : p; // dobbeltseng: prisen deles når to bor der
  return Math.round(sum);
}
const isPaid = b => !!b.paid;
const nightsBetween = (a, b) => idx(b) - idx(a);

/* ---------- render ---------- */
function render() {
  const beds = allBeds(), total = beds.length;
  const si = idx(selDate);
  const busy = state.bookings.filter(b => idx(b.start) <= si && si < idx(b.end)).length;
  const rooms = state.cabins.reduce((a, c) => a + c.rooms.length, 0);
  const bm0 = bedMap(), owed = { total: 0, paid: 0 };
  state.bookings.forEach(b => { const c = stayCost(b, bm0); owed.total += c; if (isPaid(b)) owed.paid += c; });
  owed.rest = owed.total - owed.paid;
  $('#stats').innerHTML = `
    <div class="card"><div class="k">Anlegg</div><div class="v">${total} senger</div><div class="s">${state.cabins.length} hytter · ${rooms} rom${beds.some(b => b.dbl) ? ' · ' + beds.filter(b => b.dbl && b.slot === 0).length + (beds.filter(b => b.dbl && b.slot === 0).length === 1 ? ' dobbeltseng' : ' dobbeltsenger') : ''}</div></div>
    <div class="card"><div class="k">Reservasjoner</div><div class="v">${state.bookings.length}</div><div class="s">${new Set(state.bookings.map(b => b.guest.toLowerCase())).size} gjester totalt</div></div>
    <div class="card"><div class="k">Gjenstår å betale</div><div class="v">${kr(owed.rest)}</div><div class="s">${kr(owed.paid)} betalt av ${kr(owed.total)} · se Oppgjør</div></div>

/* ---------- drag to reserve ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const days = e.target.closest && e.target.closest('.days');
  if (!days || e.target.closest('.res') || (e.button && e.button !== 0)) return;
  const day = dayAt(days, e.clientX);
  if (occupied(days.dataset.bed, day)) return;
  drag = { days, bed: days.dataset.bed, anchor: day, lo: day, hi: day };
  paint();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const cur = dayAt(drag.days, e.clientX);
  let lo = drag.anchor, hi = drag.anchor;
  for (let i = drag.anchor - 1; i >= cur && !occupied(drag.bed, i); i--) lo = i;
  for (let i = drag.anchor + 1; i <= cur && !occupied(drag.bed, i); i++) hi = i;
  drag.lo = lo; drag.hi = hi; paint();
});
document.addEventListener('pointerup', () => {

  const d = drag; drag = null; paint(d);
  openBooking({ guest: '', bed: d.bed, start: iso(d.lo), end: iso(d.hi + 1) });
});
document.addEventListener('pointercancel', () => { if (drag) { const d = drag; drag = null; paint(d); } });

function paint(d) {
  const t = d || drag; if (!t) return;
  t.days.querySelectorAll('.c').forEach((c, i) => c.classList.toggle('sel', !d && i >= t.lo && i <= t.hi));
}

/* ---------- setup dialog ---------- */

  renderSetup();

}
function ensureTypes(r) { r.types = Array.from({ length: r.beds }, (_, i) => (r.types && r.types[i]) || 's'); }

  const dlg = $('#setupDlg');

function setupStep(a, d) {
  const [t, x, y] = a.split(':');
  if (t === 'cabins') {
    if (d > 0 && draft.length < 20) { justAdded = draft.length; draft.push({ id: uid(), name: 'Hytte ' + (draft.length + 1), price: price(draft[draft.length - 1]), priceDouble: priceD(draft[draft.length - 1]), rooms: [{ id: uid(), name: 'Rom 1', beds: 2, types: ['s', 's'] }] }); }
    if (d < 0 && draft.length > 1) draft.pop();
  } else if (t === 'rooms') {
    const c = draft[+x];
    if (d > 0 && c.rooms.length < 12) c.rooms.push({ id: uid(), name: 'Rom ' + (c.rooms.length + 1), beds: 2, types: ['s', 's'] });
    if (d < 0 && c.rooms.length > 1) c.rooms.pop();
  } else if (t === 'single' || t === 'double') {
    const r = draft[+x].rooms[+y], ch = t === 'single' ? 's' : 'd';

    if (d < 0 && r.types.length > 1) { const i = r.types.lastIndexOf(ch); if (i >= 0) r.types.splice(i, 1); }

  const lost = state.bookings.filter(b => !keys.has(b.bed));
  if (lost.length && !confirm(`${lost.length} reservasjon(er) (${lost.map(b => b.guest).join(', ')}) ligger på senger som fjernes og blir slettet. Fortsette?`)) return;
  state.cabins = draft; state.bookings = state.bookings.filter(b => keys.has(b.bed));
  save(); $('#setupDlg').close(); render();
}

  const id = e.target.dataset && e.target.dataset.paid; if (!id) return;
  const b = state.bookings.find(x => x.id === id); if (b) { b.paid = e.target.checked; save(); render(); }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    try {
      const s = JSON.parse(txt);
      if (!Array.isArray(s.cabins) || !Array.isArray(s.bookings)) throw 0;
      if (confirm('Erstatte nåværende data med den importerte filen?')) { state = s; save(); $('#setupDlg').close(); render(); }
    } catch (err) { alert('Kunne ikke lese filen.'); }
  });
  e.target.value = '';
});
render();
})();
</script>
</body>
</html>
